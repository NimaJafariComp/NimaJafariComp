name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # 03:00 JST == 18:00 UTC, change if you want
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            # Pull with rebase to integrate remote changes, then push
            # Retry in case of race conditions or transient remote errors
            success=false
            max_attempts=6
            sleep_seconds=10
            for ((i=1; i<=max_attempts; i++)); do
              # Fetch latest changes before attempting rebase
              echo "Fetching latest changes (attempt $i/$max_attempts)..."
              git fetch origin main

              if git rebase origin/main; then
                if push_output=$(git push origin main 2>&1); then
                  echo "Successfully pushed changes"
                  success=true
                  break
                else
                  echo "$push_output"
                  echo "Push failed (attempt $i/$max_attempts)"
                fi
              else
                # Check for rebase conflicts
                if git status | grep -q "rebase in progress"; then
                  echo "Rebase conflict detected, aborting rebase"
                  git rebase --abort
                  echo "Cannot auto-resolve conflicts in generated files"
                  exit 1
                else
                  echo "Rebase failed (attempt $i/$max_attempts)"
                fi
              fi

              if [ "$success" = false ] && [ $i -lt $max_attempts ]; then
                echo "Retrying in $sleep_seconds seconds..."
                sleep "$sleep_seconds"
                sleep_seconds=$((sleep_seconds * 2))
              fi
            done

            if [ "$success" = false ]; then
              echo "Failed to push after $max_attempts attempts"
              exit 1
            fi
          fi
